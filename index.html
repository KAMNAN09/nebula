<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nebula · 你的个人宇宙</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f5d76e'/%3E%3Ccircle cx='6' cy='9' r='1.2' fill='%236ec1e4'/%3E%3Ccircle cx='26' cy='11' r='1' fill='%23c99bff'/%3E%3Ccircle cx='10' cy='25' r='1.4' fill='%239be29b'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#05050f;
    --ink:#e8e6f0;
    --ink-dim:#8a87a3;
    --gold:#f5d76e;
    --blue:#6ec1e4;
    --green:#9be29b;
    --violet:#c99bff;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  #sky{position:fixed;inset:0;z-index:0;cursor:grab}
  #sky.dragging{cursor:grabbing}
  #stars{position:fixed;inset:0;z-index:1;pointer-events:none}
  .star{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);
    transition:filter .25s}
  .star .dot{width:14px;height:14px;border-radius:50%;
    box-shadow:0 0 12px currentColor,0 0 30px currentColor;
    animation:pulse 3s ease-in-out infinite}
  .star:hover .dot,.star.active .dot{transform:scale(1.5)}
  .star .label{position:absolute;left:50%;top:18px;transform:translateX(-50%);
    white-space:nowrap;font-size:12px;letter-spacing:.05em;color:var(--ink-dim);
    text-shadow:0 0 8px rgba(0,0,0,.9);opacity:0;transition:opacity .2s}
  .star:hover .label,.star.active .label{opacity:1}
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}

  header{position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;pointer-events:none}
  header>*{pointer-events:auto}
  .brand{font-family:"Noto Serif SC","Songti SC",Georgia,serif;font-size:18px;letter-spacing:.15em;
    color:var(--ink)}
  .brand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--ink-dim);margin-top:2px;font-family:sans-serif}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:rgba(10,10,25,.6);backdrop-filter:blur(10px);
    font-size:12px;color:var(--ink-dim);cursor:pointer;transition:all .2s;
    display:flex;align-items:center;gap:6px}
  .chip .sw{width:8px;height:8px;border-radius:50%}
  .chip.on{color:var(--ink);border-color:rgba(255,255,255,.25);background:rgba(30,30,55,.7)}
  .chip:hover{color:var(--ink)}

  #add{position:fixed;right:22px;bottom:22px;z-index:10;
    width:56px;height:56px;border-radius:50%;border:1px solid rgba(245,215,110,.4);
    background:rgba(245,215,110,.1);color:var(--gold);font-size:28px;line-height:1;
    cursor:pointer;backdrop-filter:blur(10px);transition:all .2s;
    display:flex;align-items:center;justify-content:center}
  #add:hover{background:rgba(245,215,110,.2);transform:scale(1.05)}

  #panel{position:fixed;z-index:20;
    top:0;right:0;height:100%;width:min(420px,90vw);
    background:rgba(12,12,28,.92);backdrop-filter:blur(20px);
    border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
    padding:60px 30px 30px;overflow-y:auto}
  #panel.open{transform:translateX(0)}
  #panel .close{position:absolute;top:18px;right:18px;background:none;border:none;
    color:var(--ink-dim);font-size:24px;cursor:pointer;line-height:1}
  #panel .cat-tag{font-size:11px;letter-spacing:.25em;color:var(--ink-dim);text-transform:uppercase}
  #panel h2{font-family:"Noto Serif SC","Songti SC",Georgia,serif;font-size:26px;
    margin:10px 0 6px;line-height:1.3}
  #panel .meta{font-size:12px;color:var(--ink-dim);margin-bottom:20px}
  #panel .rating{color:var(--gold);letter-spacing:2px;margin-bottom:18px}
  #panel .note{font-size:14px;line-height:1.8;color:var(--ink);white-space:pre-wrap}
  #panel .del{margin-top:30px;background:none;border:1px solid rgba(255,80,80,.3);
    color:#ff8080;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer}

  #modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:20px}
  #modal.open{display:flex}
  .form{width:min(460px,100%);background:rgba(15,15,32,.97);border:1px solid var(--line);
    border-radius:14px;padding:28px}
  .form h3{font-family:"Noto Serif SC",serif;font-size:18px;margin-bottom:18px;letter-spacing:.1em}
  .form label{display:block;font-size:11px;color:var(--ink-dim);letter-spacing:.2em;margin:14px 0 6px}
  .form input,.form textarea,.form select{width:100%;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;
    font-size:14px;font-family:inherit;outline:none}
  .form input:focus,.form textarea:focus,.form select:focus{border-color:rgba(245,215,110,.4)}
  .form textarea{min-height:90px;resize:vertical}
  .form .row{display:flex;gap:10px}
  .form .row>div{flex:1}
  .form .actions{display:flex;gap:10px;margin-top:22px}
  .form button{flex:1;padding:11px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-family:inherit}
  .form .save{background:var(--gold);color:#1a1a1a;font-weight:600}
  .form .cancel{background:rgba(255,255,255,.06);color:var(--ink-dim)}

  #hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:5;
    font-size:12px;color:var(--ink-dim);letter-spacing:.1em;
    background:rgba(10,10,25,.6);padding:8px 16px;border-radius:999px;
    border:1px solid var(--line);backdrop-filter:blur(8px);pointer-events:none;
    transition:opacity .5s}

  @media (max-width:600px){
    header{padding:14px;flex-direction:column;align-items:flex-start;gap:10px}
    .chips{max-width:100%;overflow-x:auto}
    .chip{padding:6px 10px;font-size:11px}
    #panel{padding:60px 22px 22px}
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div id="stars"></div>

<header>
  <div class="brand">nebula<small>你的个人宇宙</small></div>
  <div class="chips" id="chips">
    <div class="chip on" data-cat="all"><span class="sw" style="background:#fff"></span>全部</div>
    <div class="chip" data-cat="poem"><span class="sw" style="background:var(--gold)"></span>诗 · 创作</div>
    <div class="chip" data-cat="film"><span class="sw" style="background:var(--blue)"></span>电影</div>
    <div class="chip" data-cat="book"><span class="sw" style="background:var(--green)"></span>书</div>
    <div class="chip" data-cat="music"><span class="sw" style="background:var(--violet)"></span>音乐</div>
  </div>
</header>

<button id="add" title="记录一颗新星星">+</button>

<aside id="panel">
  <button class="close" id="closePanel">×</button>
  <div class="cat-tag" id="pCat"></div>
  <h2 id="pTitle"></h2>
  <div class="meta" id="pMeta"></div>
  <div class="rating" id="pRating"></div>
  <div class="note" id="pNote"></div>
  <button class="del" id="pDel">删除这颗星</button>
</aside>

<div id="modal">
  <form class="form" id="form">
    <h3>记录一颗新星星</h3>
    <label>类别</label>
    <select id="fCat">
      <option value="poem">诗 · 你写下的</option>
      <option value="film">电影 · 你看过的</option>
      <option value="book">书 · 你读过的</option>
      <option value="music">音乐 · 你听过的</option>
    </select>
    <label>标题</label>
    <input id="fTitle" placeholder="给它起个名字" required>
    <div class="row">
      <div>
        <label>日期</label>
        <input id="fDate" type="date">
      </div>
      <div>
        <label>评分 (1-5)</label>
        <input id="fRating" type="number" min="1" max="5" value="5">
      </div>
    </div>
    <label>一段记录</label>
    <textarea id="fNote" placeholder="那一瞬间它对你意味着什么……"></textarea>
    <div class="actions">
      <button type="button" class="cancel" id="fCancel">取消</button>
      <button type="submit" class="save">种下这颗星</button>
    </div>
  </form>
</div>

<div id="hint">拖拽漫游 · 点击星星查看 · 右下角 + 记录新的</div>

<script>
const CAT = {
  poem:  {color:'#f5d76e', label:'诗 · 创作'},
  film:  {color:'#6ec1e4', label:'电影'},
  book:  {color:'#9be29b', label:'书'},
  music: {color:'#c99bff', label:'音乐'}
};
const KEY = 'nebula.v1';

function seed(){
  return [
    {id:1, cat:'poem', title:'示例 · 你的第一首诗', note:'在这里写下你创造的文字。删掉我，换成你自己的。', date:'2026-11-08', rating:5, x:2000, y:1500},
    {id:2, cat:'film', title:'银翼杀手2049', note:'氛围大于剧情。每次重看都像第一次。', date:'2026-11-01', rating:5, x:1500, y:1100},
    {id:3, cat:'music', title:'Mac Miller', note:'underground rap 里最温柔的那一个。', date:'2026-10-20', rating:5, x:2500, y:1200},
    {id:4, cat:'book', title:'示例 · 一本书', note:'你读过的书，会成为你的一部分。', date:'2026-10-15', rating:4, x:1700, y:1900}
  ];
}
let data = [];
try{ data = JSON.parse(localStorage.getItem(KEY)) || seed(); }
catch(e){ data = seed(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }

let cam = {x:0, y:0, zoom:1};
const VW = 4000, VH = 3000;

function fitCam(){
  const sx = window.innerWidth, sy = window.innerHeight;
  cam.zoom = Math.min(sx/VW, sy/VH) * 1.2;
  cam.x = 2000 - sx/2/cam.zoom;
  cam.y = 1500 - sy/2/cam.zoom;
}
function toScreen(vx, vy){
  return { x:(vx - cam.x)*cam.zoom, y:(vy - cam.y)*cam.zoom };
}

const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
let bgStars = [];
function resize(){
  cv.width = window.innerWidth * devicePixelRatio;
  cv.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
function makeBgStars(){
  bgStars = [];
  for(let i=0;i<220;i++){
    bgStars.push({
      x: Math.random()*VW, y: Math.random()*VH,
      r: Math.random()*1.4+0.3,
      a: Math.random(),
      sp: Math.random()*0.02+0.005
    });
  }
}

function draw(){
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0,0,w,h);

  const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h));
  g.addColorStop(0, '#0a0a22');
  g.addColorStop(1, '#03030a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);

  const nebulae = [
    {vx:1200, vy:900, r:700, c:'rgba(100,60,180,0.08)'},
    {vx:2800, vy:2000, r:800, c:'rgba(40,100,160,0.08)'},
    {vx:2000, vy:1500, r:600, c:'rgba(180,120,60,0.05)'}
  ];
  nebulae.forEach(n=>{
    const p = toScreen(n.vx, n.vy);
    if(p.x<-n.r*cam.zoom||p.x>w+n.r*cam.zoom||p.y<-n.r*cam.zoom||p.y>h+n.r*cam.zoom) return;
    const rg = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,n.r*cam.zoom);
    rg.addColorStop(0, n.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0,0,w,h);
  });

  bgStars.forEach(s=>{
    const p = toScreen(s.x, s.y);
    if(p.x<-10||p.x>w+10||p.y<-10||p.y>h+10) return;
    s.a += s.sp;
    const tw = 0.4 + Math.abs(Math.sin(s.a))*0.6;
    ctx.beginPath();
    ctx.arc(p.x,p.y,s.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(230,230,255,${tw})`;
    ctx.fill();
  });

  const visible = data.filter(d=>currentFilter==='all'||d.cat===currentFilter);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for(let i=0;i<visible.length;i++){
    for(let j=i+1;j<visible.length;j++){
      const a=visible[i], b=visible[j];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(d<500){
        const pa=toScreen(a.x,a.y), pb=toScreen(b.x,b.y);
        ctx.globalAlpha = 1 - d/500;
        ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

const layer = document.getElementById('stars');
let currentFilter = 'all';
let activeId = null;

function renderStars(){
  layer.innerHTML = '';
  const visible = data.filter(d=>currentFilter==='all'||d.cat===currentFilter);
  visible.forEach(d=>{
    const p = toScreen(d.x, d.y);
    const el = document.createElement('div');
    el.className = 'star' + (d.id===activeId?' active':'');
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.style.color = CAT[d.cat].color;
    el.innerHTML = `<div class="dot" style="background:${CAT[d.cat].color}"></div>
                    <div class="label">${escapeHtml(d.title)}</div>`;
    el.addEventListener('click',(e)=>{ e.stopPropagation(); openPanel(d.id); });
    layer.appendChild(el);
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function repositionStars(){
  document.querySelectorAll('.star').forEach((el,i)=>{
    const visible = data.filter(d=>currentFilter==='all'||d.cat===currentFilter);
    const d = visible[i];
    if(!d) return;
    const p = toScreen(d.x, d.y);
    el.style.left = p.x+'px';
    el.style.top = p.y+'px';
  });
}

let dragging=false, lastX=0, lastY=0, moved=false;
cv.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;moved=false;cv.classList.add('dragging');});
window.addEventListener('mousemove',e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  cam.x -= dx/cam.zoom; cam.y -= dy/cam.zoom;
  lastX=e.clientX; lastY=e.clientY;
  repositionStars();
});
window.addEventListener('mouseup',()=>{dragging=false;cv.classList.remove('dragging');});

cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;moved=false;}
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(dragging&&e.touches.length===1){
    const dx=e.touches[0].clientX-lastX, dy=e.touches[0].clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    cam.x -= dx/cam.zoom; cam.y -= dy/cam.zoom;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    repositionStars();
  }
},{passive:true});
cv.addEventListener('touchend',()=>{dragging=false;});

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor = e.deltaY<0 ? 1.1 : 0.9;
  const nz = Math.max(0.3, Math.min(2.5, cam.zoom*factor));
  const mx=e.clientX, my=e.clientY;
  cam.x = (mx/cam.zoom + cam.x) - (mx/nz);
  cam.y = (my/cam.zoom + cam.y) - (my/nz);
  cam.zoom = nz;
  repositionStars();
},{passive:false});

const panel = document.getElementById('panel');
function openPanel(id){
  const d = data.find(x=>x.id===id);
  if(!d) return;
  activeId = id;
  document.getElementById('pCat').textContent = CAT[d.cat].label;
  document.getElementById('pCat').style.color = CAT[d.cat].color;
  document.getElementById('pTitle').textContent = d.title;
  document.getElementById('pMeta').textContent = d.date || '';
  document.getElementById('pRating').textContent = '★'.repeat(d.rating||0) + '☆'.repeat(5-(d.rating||0));
  document.getElementById('pNote').textContent = d.note || '';
  document.getElementById('pDel').onclick = ()=>{
    if(confirm('删除这颗星？')){
      data = data.filter(x=>x.id!==id);
      save(); closePanel(); renderStars();
    }
  };
  panel.classList.add('open');
  renderStars();
}
function closePanel(){ panel.classList.remove('open'); activeId=null; renderStars(); }
document.getElementById('closePanel').onclick = closePanel;
cv.addEventListener('click',()=>{ if(!moved) closePanel(); });

document.querySelectorAll('.chip').forEach(chip=>{
  chip.onclick = ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
    chip.classList.add('on');
    currentFilter = chip.dataset.cat;
    renderStars();
  };
});

const modal = document.getElementById('modal');
document.getElementById('add').onclick = ()=>{
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  modal.classList.add('open');
};
document.getElementById('fCancel').onclick = ()=>modal.classList.remove('open');
modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });

document.getElementById('form').onsubmit = (e)=>{
  e.preventDefault();
  const cx = window.innerWidth/2/cam.zoom + cam.x + (Math.random()*200-100);
  const cy = window.innerHeight/2/cam.zoom + cam.y + (Math.random()*200-100);
  const d = {
    id: Date.now(),
    cat: document.getElementById('fCat').value,
    title: document.getElementById('fTitle').value.trim() || '未命名',
    note: document.getElementById('fNote').value,
    date: document.getElementById('fDate').value,
    rating: parseInt(document.getElementById('fRating').value)||5,
    x: Math.max(100, Math.min(VW-100, cx)),
    y: Math.max(100, Math.min(VH-100, cy))
  };
  data.push(d);
  save();
  modal.classList.remove('open');
  e.target.reset();
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  renderStars();
  openPanel(d.id);
};

window.addEventListener('resize',()=>{resize();repositionStars();});
resize();
makeBgStars();
fitCam();
renderStars();
draw();
setTimeout(()=>{document.getElementById('hint').style.opacity='0';}, 6000);
<\/script>
</body>
</html>
